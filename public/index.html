<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Assistente IA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #050a10 0%, #0a1419 100%);
            color: #00d4ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00d4ff;
            font-size: 2.5em;
        }
        #chat {
            width: 100%;
            height: 60vh;
            min-height: 400px;
            border: 2px solid #00d4ff;
            margin-bottom: 20px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0,0,0,0.9);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            scrollbar-width: thin;
            scrollbar-color: #00d4ff rgba(0,0,0,0.5);
        }
        #chat::-webkit-scrollbar {
            width: 8px;
        }
        #chat::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        #chat::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 10px;
        }
        .input-container {
            display: flex;
            width: 100%;
            gap: 10px;
            align-items: center;
        }
        #input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #00d4ff;
            color: #fff;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        #input:focus {
            border-color: #00a8cc;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }
        #sendBtn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            border: none;
            color: #050a10;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .msg {
            margin: 15px 0;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.4;
        }
        .user-msg {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            margin-left: 20px;
        }
        .jarvis-msg {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #ff6b35;
            margin-right: 20px;
        }
        .jarvis {
            color: #ff6b35;
            font-weight: bold;
            font-size: 1.1em;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(255, 59, 48, 0.1);
            border-left: 4px solid #ff3b30;
            color: #ff6b35;
        }
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .status.online {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
            border: 1px solid #34c759;
        }
        .status.offline {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border: 1px solid #ff3b30;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            #chat { height: 50vh; }
            .input-container { flex-direction: column; }
            #input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 JARVIS</h1>
        <div id="status" class="status offline">🔴 Sistema Offline</div>
        <div id="chat"></div>
        <div class="input-container">
            <input type="text" id="input" placeholder="Diga algo, Senhor..." maxlength="500">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const chat = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        let isOnline = false;

        function updateStatus(online, message = '') {
            isOnline = online;
            statusDiv.className = `status ${online ? 'online' : 'offline'}`;
            statusDiv.textContent = online ? '🟢 Sistema Online' : `🔴 ${message || 'Sistema Offline'}`;
        }

        function addMessage(sender, text, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}-msg ${isError ? 'error' : ''}`;

            if (sender === 'user') {
                msgDiv.innerHTML = `<b>Senhor:</b> ${text}`;
            } else {
                msgDiv.innerHTML = `<span class="jarvis">JARVIS:</span> ${text}`;
            }

            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg jarvis-msg';
            loadingDiv.innerHTML = '<span class="jarvis">JARVIS:</span> Processando... <div class="loading"></div>';
            loadingDiv.id = 'loading-msg';
            chat.appendChild(loadingDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideLoading() {
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            if (!isOnline) {
                addMessage('jarvis', 'Sistema offline. Verifique sua conexão e chave da API.', true);
                return;
            }

            addMessage('user', text);
            input.value = '';
            sendBtn.disabled = true;
            showLoading();

            try {
                const res = await fetch('/perguntar-jarvis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: text })
                });

                const data = await res.json();

                hideLoading();

                if (res.ok && data.resposta) {
                    addMessage('jarvis', data.resposta);
                } else {
                    let errorMsg = 'Erro desconhecido';
                    if (res.status === 401) {
                        errorMsg = 'Chave da API inválida. Verifique seu arquivo .env';
                        updateStatus(false, 'API Key Inválida');
                    } else if (res.status === 429) {
                        errorMsg = 'Quota da API excedida. Verifique seus créditos no Google AI';
                        updateStatus(false, 'Quota Excedida');
                    } else if (data.error) {
                        errorMsg = data.error;
                    }
                    addMessage('jarvis', errorMsg, true);
                }
            } catch (error) {
                hideLoading();
                addMessage('jarvis', 'Erro de conexão. Verifique se o servidor está rodando.', true);
                updateStatus(false, 'Erro de Conexão');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // Event listeners
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        sendBtn.addEventListener('click', () => {
            if (!sendBtn.disabled) sendMessage();
        });

        // Test connection on load
        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                if (res.ok && data.status === 'online') {
                    updateStatus(true);
                    addMessage('jarvis', 'Sistema inicializado com sucesso. Como posso ajudá-lo, Senhor?');
                } else {
                    updateStatus(false, 'API Offline');
                    addMessage('jarvis', 'Sistema offline. Verifique sua chave da API.', true);
                }
            } catch (error) {
                updateStatus(false, 'Erro de Conexão');
                addMessage('jarvis', 'Sistema offline. Verifique sua conexão e chave da API.', true);
            }
        });

        // Focus input on load
        input.focus();
    </script>
</body>
</html>
