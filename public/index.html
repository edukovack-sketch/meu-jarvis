<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Assistente IA</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #03070c;
            --panel: rgba(3, 12, 18, 0.82);
            --panel-strong: rgba(5, 18, 27, 0.94);
            --blue: #00d4ff;
            --blue-soft: rgba(0, 212, 255, 0.28);
            --blue-line: rgba(118, 233, 255, 0.62);
            --red: #ff263f;
            --red-soft: rgba(255, 38, 63, 0.28);
            --gold: #f7b84a;
            --text: #e9fbff;
            --muted: #82a7b1;
        }
        body {
            background:
                radial-gradient(circle at 50% 28%, rgba(0, 212, 255, 0.2), transparent 18rem),
                linear-gradient(135deg, #03070c 0%, #08121a 48%, #040608 100%);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 28px;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 42px 42px;
            -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 78%);
            mask-image: radial-gradient(circle at center, #000 0%, transparent 78%);
        }
        .red-corner {
            position: fixed;
            top: 0;
            left: 0;
            width: min(32vw, 320px);
            height: min(46vh, 420px);
            pointer-events: none;
            background:
                radial-gradient(circle at 0 0, rgba(255, 38, 63, 0.82), transparent 48%),
                linear-gradient(135deg, rgba(255, 38, 63, 0.34), transparent 66%);
            filter: blur(2px);
            opacity: 0.92;
        }
        .red-corner::after {
            content: "";
            position: absolute;
            left: 22px;
            top: 28px;
            width: 92px;
            height: 220px;
            border-left: 2px solid rgba(255, 78, 96, 0.78);
            border-top: 2px solid rgba(255, 78, 96, 0.54);
            transform: skewX(-18deg);
            box-shadow: -18px 0 42px rgba(255, 38, 63, 0.38);
        }
        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 620px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        h1 {
            text-align: center;
            margin: 0;
            color: var(--text);
            text-shadow: 0 0 18px var(--blue), 0 0 40px rgba(0, 212, 255, 0.4);
            font-size: clamp(2rem, 7vw, 3.9rem);
            letter-spacing: 0.18em;
        }
        .reactor {
            position: relative;
            display: grid;
            place-items: center;
            width: min(58vw, 250px);
            aspect-ratio: 1;
            margin: 4px 0 2px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #effcff 0 9%, #7deeff 10% 18%, #00d4ff 19% 22%, transparent 23%),
                conic-gradient(from 12deg, transparent 0 12deg, rgba(255,255,255,0.72) 13deg 21deg, transparent 22deg 44deg),
                radial-gradient(circle, transparent 0 35%, rgba(0, 212, 255, 0.18) 36% 50%, transparent 51%),
                radial-gradient(circle, rgba(0, 212, 255, 0.08), rgba(0, 0, 0, 0.78) 66%);
            border: 2px solid rgba(154, 242, 255, 0.78);
            box-shadow:
                0 0 18px rgba(209, 250, 255, 0.9),
                0 0 48px rgba(0, 212, 255, 0.86),
                0 0 120px rgba(0, 149, 255, 0.55),
                inset 0 0 38px rgba(255, 255, 255, 0.16);
            animation: reactorPulse 3.2s ease-in-out infinite;
        }
        .reactor::before,
        .reactor::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .reactor::before {
            inset: 13%;
            border: 13px solid rgba(174, 246, 255, 0.88);
            border-top-color: rgba(255, 255, 255, 0.95);
            border-bottom-color: rgba(0, 145, 255, 0.72);
            box-shadow: inset 0 0 26px rgba(0, 212, 255, 0.72), 0 0 28px rgba(0, 212, 255, 0.74);
        }
        .reactor::after {
            inset: 32%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: radial-gradient(circle, #ffffff 0 18%, #8ff4ff 19% 48%, rgba(0, 212, 255, 0.08) 49%);
            box-shadow: 0 0 28px rgba(255,255,255,0.82), 0 0 56px rgba(0,212,255,0.9);
        }
        .reactor-ring {
            position: absolute;
            inset: -9%;
            border-radius: 50%;
            border: 1px solid rgba(118, 233, 255, 0.3);
            background:
                linear-gradient(90deg, transparent 49%, rgba(118, 233, 255, 0.28) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(118, 233, 255, 0.2) 50%, transparent 51%);
            box-shadow: 0 0 34px rgba(0, 212, 255, 0.24);
            animation: slowSpin 18s linear infinite;
        }
        #chat {
            width: 100%;
            height: min(34vh, 300px);
            min-height: 230px;
            border: 1px solid var(--blue-line);
            margin: 0;
            overflow-y: auto;
            padding: 16px;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), transparent),
                var(--panel);
            border-radius: 8px;
            box-shadow: 0 0 26px rgba(0, 212, 255, 0.2), inset 0 0 28px rgba(0, 212, 255, 0.08);
            scrollbar-width: thin;
            scrollbar-color: var(--blue) rgba(0,0,0,0.5);
        }
        #chat::-webkit-scrollbar {
            width: 8px;
        }
        #chat::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        #chat::-webkit-scrollbar-thumb {
            background: var(--blue);
            border-radius: 10px;
        }
        .input-container {
            display: flex;
            width: 100%;
            gap: 10px;
            align-items: center;
        }
        #input {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            background: var(--panel-strong);
            border: 1px solid var(--blue-line);
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        #input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.42);
        }
        #sendBtn {
            padding: 13px 24px;
            background: linear-gradient(135deg, #d9fbff, var(--blue) 48%, #007b9e);
            border: none;
            color: #050a10;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.34);
        }
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
        }
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .msg {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.94rem;
        }
        .user-msg {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid var(--blue);
            margin-left: 26px;
        }
        .jarvis-msg {
            background: rgba(255, 255, 255, 0.055);
            border-left: 3px solid var(--red);
            margin-right: 26px;
        }
        .jarvis {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1em;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--blue);
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        @keyframes reactorPulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.025); filter: brightness(1.18); }
        }
        @keyframes slowSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            background: rgba(255, 59, 48, 0.1);
            border-left: 3px solid #ff3b30;
            color: #ff9a8e;
        }
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        .status.online {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
            border: 1px solid #34c759;
        }
        .status.offline {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border: 1px solid #ff3b30;
        }
        @media (max-width: 768px) {
            body { padding: 18px; }
            .container { width: min(100%, 520px); }
            #chat { height: 32vh; min-height: 220px; }
            .input-container { flex-direction: column; }
            #input, #sendBtn { width: 100%; }
            .status {
                position: static;
                order: -1;
                align-self: flex-end;
            }
            .red-corner {
                width: 58vw;
                height: 34vh;
            }
        }
    </style>
</head>
<body>
    <div class="red-corner" aria-hidden="true"></div>
    <div class="container">
        <h1>JARVIS</h1>
        <div id="status" class="status offline" role="status">🔴 Sistema Offline</div>
        <div class="reactor" aria-hidden="true">
            <span class="reactor-ring"></span>
        </div>
        <div id="chat" role="log" aria-live="polite" aria-label="Conversa com JARVIS"></div>
        <div class="input-container">
            <input type="text" id="input" placeholder="Diga algo, Senhor..." maxlength="500" autocomplete="off">
            <button type="button" id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const chat = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        let isOnline = false;

        function updateStatus(online, message = '') {
            isOnline = online;
            statusDiv.className = `status ${online ? 'online' : 'offline'}`;
            statusDiv.textContent = online ? '🟢 Sistema Online' : `🔴 ${message || 'Sistema Offline'}`;
        }

        function addMessage(sender, text, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}-msg ${isError ? 'error' : ''}`;

            if (sender === 'user') {
                const label = document.createElement('b');
                label.textContent = 'Senhor: ';
                msgDiv.appendChild(label);
                msgDiv.appendChild(document.createTextNode(text));
            } else {
                const label = document.createElement('span');
                label.className = 'jarvis';
                label.textContent = 'JARVIS: ';
                msgDiv.appendChild(label);
                msgDiv.appendChild(document.createTextNode(text));
            }

            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg jarvis-msg';
            loadingDiv.id = 'loading-msg';

            const label = document.createElement('span');
            label.className = 'jarvis';
            label.textContent = 'JARVIS: ';

            const spinner = document.createElement('div');
            spinner.className = 'loading';

            loadingDiv.appendChild(label);
            loadingDiv.appendChild(document.createTextNode('Processando... '));
            loadingDiv.appendChild(spinner);
            chat.appendChild(loadingDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideLoading() {
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            if (!isOnline) {
                addMessage('jarvis', 'Sistema offline. Verifique sua conexão e chave da API.', true);
                return;
            }

            addMessage('user', text);
            input.value = '';
            sendBtn.disabled = true;
            showLoading();

            try {
                const res = await fetch('/perguntar-jarvis', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: text })
                });

                const data = await parseJsonResponse(res);

                hideLoading();

                if (res.ok && data.resposta) {
                    addMessage('jarvis', data.resposta);
                } else {
                    let errorMsg = 'Erro desconhecido';
                    if (res.status === 401) {
                        errorMsg = 'Chave da API inválida. Verifique seu arquivo .env';
                        updateStatus(false, 'API Key Inválida');
                    } else if (res.status === 429) {
                        errorMsg = 'Quota da API excedida. Verifique seus limites ou créditos no Groq';
                        updateStatus(false, 'Quota Excedida');
                    } else if (data.error) {
                        errorMsg = data.error;
                    }
                    addMessage('jarvis', errorMsg, true);
                }
            } catch (error) {
                hideLoading();
                addMessage('jarvis', 'Erro de conexão. Verifique se o servidor está rodando.', true);
                updateStatus(false, 'Erro de Conexão');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        async function parseJsonResponse(response) {
            try {
                return await response.json();
            } catch (error) {
                return {};
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        sendBtn.addEventListener('click', () => {
            if (!sendBtn.disabled) sendMessage();
        });

        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/status');
                const data = await parseJsonResponse(res);
                if (res.ok && data.status === 'online') {
                    updateStatus(true);
                    addMessage('jarvis', 'Sistema inicializado com sucesso. Como posso ajudá-lo, Senhor?');
                } else {
                    updateStatus(false, 'API Offline');
                    addMessage('jarvis', 'Sistema offline. Verifique sua chave da API.', true);
                }
            } catch (error) {
                updateStatus(false, 'Erro de Conexão');
                addMessage('jarvis', 'Sistema offline. Verifique sua conexão e chave da API.', true);
            }
        });

        input.focus();
    </script>
</body>
</html>
